<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YT Looper</title>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-48.png" alt="" width="28" height="28" />
        <h1>YT Looper</h1>
      </header>

      <p id="message" class="message" role="status" hidden></p>

      <div id="controls" hidden>
        <section class="card">
          <label for="start">Start</label>
          <div class="field">
            <input id="start" data-field="start" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0:00" />
            <button type="button" class="primary" data-mark="start">Set start</button>
          </div>
          <div class="nudge" role="group" aria-label="Adjust start">
            <button type="button" data-nudge="start" data-delta="-1">-1s</button>
            <button type="button" data-nudge="start" data-delta="-0.1">-0.1s</button>
            <button type="button" data-nudge="start" data-delta="0.1">+0.1s</button>
            <button type="button" data-nudge="start" data-delta="1">+1s</button>
          </div>
        </section>

        <section class="card">
          <label for="end">End</label>
          <div class="field">
            <input id="end" data-field="end" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0:00" />
            <button type="button" class="primary" data-mark="end">Set end</button>
          </div>
          <div class="nudge" role="group" aria-label="Adjust end">
            <button type="button" data-nudge="end" data-delta="-1">-1s</button>
            <button type="button" data-nudge="end" data-delta="-0.1">-0.1s</button>
            <button type="button" data-nudge="end" data-delta="0.1">+0.1s</button>
            <button type="button" data-nudge="end" data-delta="1">+1s</button>
          </div>
        </section>

        <footer>
          <button id="toggle" type="button" aria-pressed="true">Loop on</button>
          <button id="clear" type="button">Clear</button>
        </footer>

        <p id="status" class="status" role="status"></p>
      </div>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
