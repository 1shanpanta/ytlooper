<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YT Looper</title>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <img src="icons/icon-48.png" alt="" width="24" height="24" />
          <h1>YT Looper</h1>
        </div>
        <button id="toggle" type="button" class="switch" role="switch" aria-checked="true" aria-label="Loop">
          <span class="switch-label">Loop</span>
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        </button>
      </header>

      <p id="message" class="message" role="status" hidden></p>

      <div id="controls" hidden>
        <div id="range" class="range" aria-hidden="true">
          <div id="range-fill" class="range-fill"></div>
        </div>

        <div class="cards">
          <section class="card">
            <label for="start">Start</label>
            <input id="start" data-field="start" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0:00" />
            <button type="button" class="mark" data-mark="start">Set start</button>
            <div class="nudge" role="group" aria-label="Adjust start">
              <button type="button" data-nudge="start" data-delta="-1" aria-label="Start back 1 second">-1</button>
              <button type="button" data-nudge="start" data-delta="-0.1" aria-label="Start back 0.1 second">-.1</button>
              <button type="button" data-nudge="start" data-delta="0.1" aria-label="Start forward 0.1 second">+.1</button>
              <button type="button" data-nudge="start" data-delta="1" aria-label="Start forward 1 second">+1</button>
            </div>
          </section>

          <section class="card">
            <label for="end">End</label>
            <input id="end" data-field="end" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0:00" />
            <button type="button" class="mark" data-mark="end">Set end</button>
            <div class="nudge" role="group" aria-label="Adjust end">
              <button type="button" data-nudge="end" data-delta="-1" aria-label="End back 1 second">-1</button>
              <button type="button" data-nudge="end" data-delta="-0.1" aria-label="End back 0.1 second">-.1</button>
              <button type="button" data-nudge="end" data-delta="0.1" aria-label="End forward 0.1 second">+.1</button>
              <button type="button" data-nudge="end" data-delta="1" aria-label="End forward 1 second">+1</button>
            </div>
          </section>
        </div>

        <footer>
          <p id="status" class="status" role="status"></p>
          <button id="clear" type="button" class="link">Clear</button>
        </footer>
      </div>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
